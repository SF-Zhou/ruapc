name: Rust
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUAPC_PREFER_RXE: "1"

jobs:
  build:
    name: Build and test (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v6

    - name: Configure
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup Soft-RoCE
      uses: SF-Zhou/setup-soft-roce-action@v1

    - name: Install llvm-tools
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: llvm-tools-preview,rustfmt,clippy

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config libibverbs-dev ibverbs-utils

    - name: Run tests
      run: |
        sudo prlimit --pid $$ -l=unlimited && ulimit -a
        ibv_devinfo -d rxe_0 -v
        cargo fmt -- --check
        cargo clippy --release --all-features -- -D warnings
        cargo llvm-cov --all-features --ignore-filename-regex "ruapc-demo/*|ruapc-macro/*|ruapc/src/bin/*|ruapc-rdma/src/bin/*" --cobertura --output-path cobertura.xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: SF-Zhou/ruapc
        files: cobertura.xml
