[package]
name = "ruapc-rdma"
version.workspace = true
description = "Low-level FFI bindings to libibverbs with type-safe device management for RDMA operations"
readme = "README.md"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["rdma", "ibverbs", "infiniband", "roce", "ffi"]
categories = ["network-programming", "external-ffi-bindings"]

[features]
bin = ["dep:clap"]
# Use the installed libibverbs extended GID APIs instead of compatibility queries.
ibv-query-gid-ex = []
# Internal ownership components for standalone, device-free benchmarks.
bench-internals = []

[[bench]]
name = "buffer_stash"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "read_bookkeeping"
harness = false
required-features = ["bench-internals"]

[dependencies]
clap = { workspace = true, optional = true }
enumflags2.workspace = true
libc.workspace = true
ruapc-bufpool.workspace = true
schemars.workspace = true
serde.workspace = true
strum.workspace = true

[[bin]]
name = "ibv_devinfo"
path = "src/bin/ibv_devinfo.rs"
required-features = ["bin"]

[dev-dependencies]
# Installed as the process allocator by every benchmark harness.
tikv-jemallocator.workspace = true
serde_json.workspace = true

[build-dependencies]
bindgen.workspace = true
cc.workspace = true
pkg-config.workspace = true
syn.workspace = true
prettyplease.workspace = true
