[workspace]
members = ["ruapc", "ruapc-bufpool", "ruapc-demo", "ruapc-macro", "ruapc-rdma", "ruapc-schema"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.7"
authors = ["SF-Zhou <sfzhou.scut@gmail.com>"]
edition = "2024"
homepage = "https://github.com/SF-Zhou/ruapc"
repository = "https://github.com/SF-Zhou/ruapc"
description = "A high-performance Rust RPC library supporting TCP, WebSocket, HTTP/2, and RDMA transports"
keywords = ["rpc", "http2", "rdma", "async"]
categories = ["network-programming", "asynchronous"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aliasable = "0.1"
arc-swap = "1.9"
bindgen = "0.73"
bitflags = "2.13"
bytes = "1.12"
cc = "1.10"
clap = { version = "4.6", features = ["derive"] }
crc-fast = "1.10"
dashmap = "6.2"
enumflags2 = { version = "0.7", features = ["serde"] }
foldhash = "0.2"
futures-util = "0.3"
hdrhistogram = { version = "7.6", default-features = false }
http-body-util = "0.1"
humantime-serde = "1.1"
hyper = { version = "1.12", features = ["client", "server", "http1", "http2"] }
hyper-tungstenite = "0.30"
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto"] }
indexmap = "2.14"
ipnet = { version = "2.12", features = ["serde"] }
libc = "0.2"
metrics = "0.24"
metrics-util = "0.20"
openapiv3 = "2.2"
pkg-config = "0.3"
prettyplease = "0.3"
proc-macro-crate = "3.5"
proc-macro2 = "1.0"
quote = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmp-serde = "1.3"
# The macro generates code against ruapc's internal glue API, so the two
# crates must be paired exactly (same reason serde pins serde_derive).
# Pre-release versions must stay fully qualified so Cargo will match them.
ruapc = { version = "0.2.0-alpha.7", path = "ruapc" }
ruapc-bufpool = { version = "0.2.0-alpha.7", path = "ruapc-bufpool" }
ruapc-macro = { version = "=0.2.0-alpha.7", path = "ruapc-macro" }
ruapc-rdma = { version = "0.2.0-alpha.7", path = "ruapc-rdma" }
ruapc-schema = { version = "0.2.0-alpha.7", path = "ruapc-schema" }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde-inline-default = "1.0"
serde_json = { version = "1.0" }
socket2 = "0.6"
strum = { version = "0.28", features = ["derive"] }
syn = { version = "3.0", features = ["full"] }
tikv-jemallocator = "0.7"
tokio = { version = "1.54", features = ["full"] }
tokio-tungstenite = "0.30"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }
trybuild = "1.0"

[workspace.lints.clippy]
